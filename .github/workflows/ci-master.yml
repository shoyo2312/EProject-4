name: CI - Tier 2 (master)

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-master-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-master-jwt-secret-not-for-production-0123456789' }}

jobs:
  build-and-test:
    name: Build + Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (skip tests)
        run: ./mvnw -B -ntp clean install -DskipTests

      - name: Run full test suite (unit + integration)
        run: ./mvnw -B -ntp verify

      - name: Publish test reports
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Full Test Results (master)
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

  # rank-service and moderation-service are not Maven modules, so ./mvnw never ran their tests.
  python-tests:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [moderation-service, rank-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      # The version both Dockerfiles build on.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      # From the CPU index, at the version the Dockerfile pins — read out of it, so the two cannot
      # drift. test_harm imports the CLIP scorer, which imports torch; no weights are fetched.
      - name: Install torch
        if: matrix.service == 'moderation-service'
        run: pip install --index-url https://download.pytorch.org/whl/cpu "$(grep -o 'torch==[0-9.]*' Dockerfile)"

      # LightGBM needs libgomp at runtime, as its Dockerfile says.
      - name: Install libgomp
        if: matrix.service == 'rank-service'
        run: sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

  code-quality:
    name: Code Quality (full)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (skip tests)
        run: ./mvnw -B -ntp clean install -DskipTests

      - name: SpotBugs full analysis
        run: ./mvnw -B -ntp com.github.spotbugs:spotbugs-maven-plugin:4.8.6.2:check

      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.token=$SONAR_TOKEN

  security-scan:
    name: OWASP Dependency-Check
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (skip tests)
        run: ./mvnw -B -ntp clean install -DskipTests

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-db-${{ runner.os }}

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw -B -ntp org.owasp:dependency-check-maven:check \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DfailBuildOnCVSS=8 \
            -Dformat=ALL

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'
          retention-days: 30

  quality-gate:
    name: Quality Gate (required before merge to master)
    needs: [build-and-test, python-tests, code-quality, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: echo "Build, full test suite, code quality, and security scan all passed."
