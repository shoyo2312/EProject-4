version: '3.9'

# =====================================================================
# TikTok Backend — Local Development Infrastructure
# =====================================================================
# Khởi động: docker-compose up -d
# Tắt:       docker-compose down
# Tắt + xoá data: docker-compose down -v
# Log service X: docker-compose logs -f postgres-auth
# =====================================================================

services:

  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL (Database per service)
  # ─────────────────────────────────────────────────────────────────

  postgres-auth:
    image: postgres:16-alpine
    container_name: tt-postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  postgres-user:
    image: postgres:16-alpine
    container_name: tt-postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  postgres-product:
    image: postgres:16-alpine
    container_name: tt-postgres-product
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d product_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  postgres-cart:
    image: postgres:16-alpine
    container_name: tt-postgres-cart
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - postgres-cart-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cart_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  postgres-order:
    image: postgres:16-alpine
    container_name: tt-postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d order_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  postgres-payment:
    image: postgres:16-alpine
    container_name: tt-postgres-payment
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5437:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d payment_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  postgres-inventory:
    image: postgres:16-alpine
    container_name: tt-postgres-inventory
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5438:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d inventory_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  postgres-admin:
    image: postgres:16-alpine
    container_name: tt-postgres-admin
    environment:
      POSTGRES_DB: admin_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5439:5432"
    volumes:
      - postgres-admin-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d admin_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  # ─────────────────────────────────────────────────────────────────
  # MongoDB (Video, Story, Chat, Notification)
  # ─────────────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7
    container_name: tt-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin -u ${MONGO_USERNAME:-root} -p ${MONGO_PASSWORD:-password} --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  # ─────────────────────────────────────────────────────────────────
  # Redis (Cache, Session, Cart, Pub/Sub)
  # ─────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: tt-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  # ─────────────────────────────────────────────────────────────────
  # Cassandra (Interaction Service)
  # ─────────────────────────────────────────────────────────────────

  cassandra:
    image: cassandra:5.0
    container_name: tt-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: tiktok-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'describe keyspaces'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tiktok-network

  cassandra-init:
    image: cassandra:5.0
    container_name: tt-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./scripts/cassandra-init.cql:/scripts/init.cql:ro
    entrypoint: [ "cqlsh", "cassandra", "-f", "/scripts/init.cql" ]
    networks:
      - tiktok-network
    restart: "no"

  # ─────────────────────────────────────────────────────────────────
  # Kafka + Zookeeper
  # ─────────────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: tt-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - tiktok-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tt-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tiktok-network

  # Kafka UI (optional, dev-only)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tt-kafka-ui
    depends_on:
      - kafka
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - tiktok-network
    profiles:
      - tools   # chỉ start khi: docker-compose --profile tools up -d

  # ─────────────────────────────────────────────────────────────────
  # Elasticsearch (Search Service)
  # ─────────────────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: tt-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - tiktok-network

  # ─────────────────────────────────────────────────────────────────
  # ClickHouse (Analytics Service)
  # ─────────────────────────────────────────────────────────────────

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: tt-clickhouse
    environment:
      CLICKHOUSE_DB: analytics_db
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    ports:
      - "8123:8123"
      - "9004:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  # ─────────────────────────────────────────────────────────────────
  # MinIO (Object Storage — Videos, Images)
  # ─────────────────────────────────────────────────────────────────

  minio:
    image: minio/minio:latest
    container_name: tt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-network

  # Creates the media bucket and its retention rule. Without this, video-service happily signs
  # an upload URL for a bucket that does not exist -- presigning is a local signature and never
  # contacts the server -- and the client only finds out when its PUT returns NoSuchBucket,
  # mid-upload. media-worker creates the bucket on startup, but video-service can be run alone.
  #
  # The lifecycle rule expires abandoned uploads: /upload-url persists nothing, so a client that
  # never calls /videos leaves an object no row references and nothing else would ever delete.
  # Seven days is well past the point media-worker has read a raw file it was told about.
  #
  # ilm import replaces the whole config rather than appending, which is what makes re-running
  # this container a no-op instead of a duplicate-rule error.
  minio-init:
    image: minio/mc:latest
    container_name: tt-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-video-media}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set tt http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "tt/$$MINIO_BUCKET"
        echo '{"Rules":[{"ID":"expire-abandoned-raw-uploads","Status":"Enabled","Filter":{"Prefix":"raw/"},"Expiration":{"Days":7}}]}' \
          | mc ilm import "tt/$$MINIO_BUCKET"
        echo "minio-init: bucket $$MINIO_BUCKET ready"
    networks:
      - tiktok-network

# ─────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────
volumes:
  postgres-auth-data:
  postgres-user-data:
  postgres-product-data:
  postgres-cart-data:
  postgres-order-data:
  postgres-payment-data:
  postgres-inventory-data:
  postgres-admin-data:
  mongodb-data:
  redis-data:
  cassandra-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  elasticsearch-data:
  minio-data:
  clickhouse-data:

# ─────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────
networks:
  tiktok-network:
    name: tiktok-network
    driver: bridge