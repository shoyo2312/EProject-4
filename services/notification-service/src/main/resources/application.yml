server:
  port: 8089

spring:
  application:
    name: notification-service

  data:
    mongodb:
      uri: mongodb://root:password@localhost:27017/notification_db?authSource=admin
      # Off by default since Spring Data Mongo 3.x, which left recipient_feed_idx uncreated:
      # every inbox read was a collection scan sorted in memory.
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Only ever used by kafka-lib's DeadLetterPublishingRecoverer — this service produces
    # nothing of its own, but without a serializer the DLT send fails and the poison message
    # goes back to blocking its partition, which is the whole point of having a DLT.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

downstream:
  video-service-uri: ${VIDEO_SERVICE_URI:http://localhost:8083}
  timeout-millis: ${DOWNSTREAM_TIMEOUT_MILLIS:1000}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
