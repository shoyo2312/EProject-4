server:
  port: 8089

spring:
  application:
    name: notification-service

  data:
    mongodb:
      # From the environment like every other Mongo service's: the literal localhost URI this used to
      # be could not be pointed anywhere else, so the service only ever ran beside its database.
      uri: mongodb://${MONGO_USERNAME:root}:${MONGO_PASSWORD:password}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/notification_db?authSource=admin
      # Off by default since Spring Data Mongo 3.x, which left the inbox index uncreated:
      # every inbox read was a collection scan sorted in memory.
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Used by NotificationEventPublisher, and by kafka-lib's DeadLetterPublishingRecoverer —
    # without a serializer the DLT send fails and the poison message goes back to blocking its
    # partition, which is the whole point of having a DLT.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

downstream:
  video-service-uri: ${VIDEO_SERVICE_URI:http://localhost:8083}
  user-service-uri: ${USER_SERVICE_URI:http://localhost:8082}
  interaction-service-uri: ${INTERACTION_SERVICE_URI:http://localhost:8085}
  timeout-millis: ${DOWNSTREAM_TIMEOUT_MILLIS:1000}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
