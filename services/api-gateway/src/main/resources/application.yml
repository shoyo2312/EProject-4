server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**
        - id: video-service
          uri: ${VIDEO_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/videos/**
        - id: interaction-service
          uri: ${INTERACTION_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/interactions/**
        - id: recommendation-service
          uri: ${RECOMMENDATION_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/recommendations/**
        # Admin console traffic. Both services enforce ROLE_ADMIN themselves —
        # the gateway only checks that a valid access token is present.
        - id: admin-service
          uri: ${ADMIN_SERVICE_URI:http://localhost:8096}
          predicates:
            - Path=/api/v1/admin/**
        - id: search-service
          uri: ${SEARCH_SERVICE_URI:http://localhost:8095}
          predicates:
            - Path=/api/v1/search/**
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URI:http://localhost:8097}
          predicates:
            - Path=/api/v1/analytics/**
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: "#{@ipKeyResolver}"

downstream:
  auth-service-uri: ${AUTH_SERVICE_URI:http://localhost:8081}
  user-service-uri: ${USER_SERVICE_URI:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
