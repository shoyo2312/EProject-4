spring:
  kafka:
    listener:
      # Consumer tests invoke the listener methods directly, so the containers only add a
      # background reconnect loop against a broker that isn't running in tests.
      auto-startup: false

app:
  cache:
    video:
      # Off for the Spring-context tests, which run without a Redis. VideoCache fails open, so
      # leaving it on would still pass — at the cost of a connection attempt and its timeout on
      # every cached read. What the cache does is covered by VideoCacheTest and
      # VideoServiceImplCacheTest, both plain Mockito.
      enabled: false
      ttl: 60s

moderation:
  text:
    # No moderation-service or admin-service in tests: the classifier is never asked and no poller
    # starts. Covered by moderation-lib's own tests and CaptionModerationTest.
    classifier:
      base-url: ""
    admin-terms:
      base-url: ""
