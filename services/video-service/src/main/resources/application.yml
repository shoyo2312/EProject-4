server:
  port: 8083

spring:
  application:
    name: video-service

  data:
    mongodb:
      uri: mongodb://root:password@localhost:27017/video_db?authSource=admin
      # Off by default since Spring Data Mongo 3.x, which silently left every @Indexed and
      # @CompoundIndex in this service uncreated: feed_idx was absent (feed queries were
      # collection scans) and ProcessedEvent.eventId had no unique index, so the idempotency
      # claim had nothing to enforce it. Asserted by ProcessedEventRepositoryTest.
      auto-index-creation: true
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

app:
  media:
    # Where CreateVideoRequest.rawFileUrl is allowed to point. Buckets must match media-worker's
    # MINIO_BUCKET; hosts are the public CDN/MinIO host(s) in front of it. Both empty means
    # reject everything, so set them per environment.
    allowed-hosts: ${MEDIA_ALLOWED_HOSTS:cdn.tiktok-clone.local}
    allowed-buckets: ${MEDIA_ALLOWED_BUCKETS:video-media}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
