server:
  port: 8083

spring:
  application:
    name: video-service

  data:
    mongodb:
      uri: mongodb://root:password@localhost:27017/video_db?authSource=admin
      # Off by default since Spring Data Mongo 3.x, which silently left every @Indexed and
      # @CompoundIndex in this service uncreated: feed_idx was absent (feed queries were
      # collection scans) and ProcessedEvent.eventId had no unique index, so the idempotency
      # claim had nothing to enforce it. Asserted by ProcessedEventRepositoryTest.
      auto-index-creation: true
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: video-service
      # Kafka's own default is "latest", which silently discards everything already on a topic
      # whenever this group has no committed offset — a first deploy, or offsets aged out after
      # a long outage. The events dropped that way are ones nothing re-sends: a missed
      # VideoTranscodedEvent leaves a video PROCESSING forever, and a missed like or comment is
      # a counter that stays wrong.
      #
      # Replaying is safe here even though two consumers do a non-idempotent $inc. Every
      # consumer claims its eventId in processed_events first, those claims live 30 days
      # (ProcessedEvent), and the broker keeps records for 7 (KAFKA_LOG_RETENTION_HOURS=168).
      # Anything old enough to be replayed still has its claim, so it is skipped rather than
      # counted twice. Shortening the TTL below the broker's retention would break that.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

app:
  cache:
    video:
      # Metadata cache in front of GET /videos/{id} and GET /videos/batch. Off takes both
      # straight to Mongo; see VideoCacheProperties for why the TTL is this short.
      enabled: ${VIDEO_CACHE_ENABLED:true}
      ttl: ${VIDEO_CACHE_TTL:60s}

  media:
    # Where CreateVideoRequest.rawFileUrl is allowed to point. Buckets must match media-worker's
    # MINIO_BUCKET; hosts are the public CDN/MinIO host(s) in front of it. Both empty means
    # reject everything, so set them per environment.
    allowed-hosts: ${MEDIA_ALLOWED_HOSTS:cdn.tiktok-clone.local}
    allowed-buckets: ${MEDIA_ALLOWED_BUCKETS:video-media}

minio:
  # Must match media-worker's MinIO settings — it transcodes out of the same bucket these
  # presigned uploads land in. endpoint is what the browser PUTs to, so in any deployment where
  # the client is not on the service network this is the public address, not the internal one.
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:video-media}
  region: ${MINIO_REGION:us-east-1}
  # Long enough for a phone on a slow connection to finish a clip, short enough that a URL
  # leaked from a client log is not a lasting write grant on the bucket.
  url-expiry: ${MINIO_URL_EXPIRY:15m}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
