server:
  port: 8096

spring:
  application:
    name: admin-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5439}/admin_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # listReports and listActions take a Pageable straight from the query string, so without
        # a cap a client can ask for ?size=100000 and pull the whole report queue in one request.
        # Same values as user-service and video-service.
        default-page-size: 20
        max-page-size: 50

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

admin:
  retention:
    # Off-peak and daily: the grace is measured in days, nothing here is urgent.
    cron: "0 45 3 * * *"
    batch-size: 1000
    max-batches-per-run: 100
    # Measured from publication, not creation. Long enough to still have the row when someone
    # asks about a ban from last week, short enough that the table stops growing.
    published-outbox-grace: 7d

  stale-reports:
    # After the outbox sweep, same off-peak window.
    cron: "0 55 3 * * *"
    # How long a report gets to be looked at by a person before the service closes it. Long
    # enough that a quiet week does not eat the queue, short enough that the backlog has an end.
    grace: 30d
    # Targets above this many standing reports are never swept, however old the reports are:
    # a crowd flagging the same thing is a signal, not a backlog.
    max-reports-per-target: 2
    batch-size: 500
    max-batches-per-run: 20

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
