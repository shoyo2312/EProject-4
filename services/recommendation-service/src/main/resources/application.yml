server:
  port: 8087

spring:
  application:
    name: recommendation-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: recommendation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # One consumer thread per partition (topics are created with 3) rather than one thread for
      # all of them — watch events in particular arrive faster than one thread drains them. Each
      # partition keeps a single thread, so per-video order holds; every listener here claims its
      # eventId with SETNX and writes with atomic Redis commands, so running side by side is safe.
      concurrency: 3
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

reco:
  rank:
    # The LightGBM ranker. Internal network only — it holds no user data and does no auth, and
    # nothing outside this service should be able to reach it.
    base-url: ${RANK_SERVICE_URL:http://localhost:8098}
    enabled: ${RANK_ENABLED:true}
    # Inside a request a person is waiting on. A ranker that stops answering must cost the feed
    # a fraction of a second and then be ignored.
    timeout-millis: 150

downstream:
  user-service-uri: ${USER_SERVICE_URI:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
