server:
  port: 8091

spring:
  application:
    name: cart-service

  datasource:
    url: jdbc:postgresql://localhost:5435/cart_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

product-service:
  base-url: ${PRODUCT_SERVICE_URL:http://localhost:8090}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
