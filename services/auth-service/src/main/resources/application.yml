server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

auth:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}
    access-token-expiry-millis: 900000
    refresh-token-expiry-millis: 604800000
    # Grace for a client retrying a refresh it never got the answer to. See JwtProperties.
    rotation-grace-millis: 10000
  otp:
    email-verification-expiry-millis: 900000
    password-reset-expiry-millis: 900000
  retention:
    # Off-peak, and daily: nothing here is urgent, and the graces are measured in days.
    cron: "0 30 3 * * *"
    batch-size: 1000
    max-batches-per-run: 100
    # Each grace runs from when the row stopped being useful, not from when it was written.
    refresh-token-grace: 7d
    verification-token-grace: 1d
    published-outbox-grace: 7d
  mail:
    from: ${MAIL_FROM:no-reply@tiktok-clone.dev}
  turnstile:
    # Checked on every OTP-issuing call (register, addEmail, resendVerification,
    # forgotPassword) before anything else runs.
    secret-key: ${TURNSTILE_SECRET_KEY:}
  oauth:
    google:
      # Every client id we ship — web (Next.js), iOS and Android each have their own, and an ID
      # token's `aud` is whichever one signed the user in. Comma-separated in the env var.
      client-ids: ${GOOGLE_CLIENT_IDS:}
    facebook:
      app-id: ${FB_APP_ID:}
      # A password for our Facebook app: env var only, never a value committed here.
      app-secret: ${FB_APP_SECRET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
