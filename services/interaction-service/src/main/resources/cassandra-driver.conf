datastax-java-driver {
  advanced {
    # A host restart brings this service up beside Cassandra rather than after it (depends_on
    # does not apply to containers the Docker daemon restarts). Without this the driver throws on
    # the first refused connection and the context dies; with it, building the session waits and
    # retries on the reconnection policy until a node answers.
    reconnect-on-init = true
  }
}
