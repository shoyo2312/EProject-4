server:
  port: 8085

spring:
  application:
    name: interaction-service

  cassandra:
    keyspace-name: interaction_ks
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost}
    port: ${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_LOCAL_DC:dc1}
    schema-action: CREATE_IF_NOT_EXISTS

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: interaction-service
      # "latest" would drop every moderation event already on the topic whenever this group has
      # no committed offset — a first deploy, or offsets aged out — and a dropped removal is a
      # comment that stays up with nothing left to say it should not be. Replay is safe: the
      # soft delete is an LWT conditioned on the comment still being live, so a redelivered
      # removal changes nothing and never decrements the counter twice.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

downstream:
  video-service-uri: ${VIDEO_SERVICE_URI:http://localhost:8083}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
