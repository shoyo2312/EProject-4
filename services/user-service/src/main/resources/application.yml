server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/user_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # listFollowers/listFollowing/listBlocked/listMuted take a Pageable straight from the
        # query string, so without a cap a client can ask for ?size=100000 and pull the whole
        # relation table in one request. Same values as video-service.
        default-page-size: 20
        max-page-size: 50

  servlet:
    multipart:
      # Avatars only — this service takes no other upload. Kept a touch above app.avatar.max-bytes
      # so an oversized file is refused by the endpoint, with its own message, rather than by the
      # container with a generic one.
      max-file-size: ${AVATAR_MAX_FILE_SIZE:6MB}
      max-request-size: ${AVATAR_MAX_REQUEST_SIZE:7MB}

  task:
    scheduling:
      # One thread per @Scheduled method: the outbox poll, the two retention cleanups, the data
      # export worker and its cleanup, and the weekly screen time digest. On the default pool of
      # one they take turns, and an outbox poll waiting out its ack timeout on a dead broker holds
      # up every other job behind it.
      pool:
        size: 6

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

user:
  retention:
    # Off-peak, and daily: nothing here is urgent, and the grace is measured in days.
    cron: "0 45 3 * * *"
    batch-size: 1000
    max-batches-per-run: 100
    # Must stay above the Kafka topic retention, not tuned for table size: while the broker can
    # still replay an offset, the claim is the only thing standing between a redelivery and a
    # double count. 30d matches video-service's TTL on processed_events.
    processed-event-grace: 30d
    # Outbox rows the broker already acknowledged. Measured from publication, not creation: long
    # enough to still have the row when someone asks why a follower count moved last week, short
    # enough that the table stops growing.
    published-outbox-grace: 7d

  screen-time:
    # Hourly, so each zone gets its Monday 09:00 update within the hour (WeeklyScreenTimeDigest).
    # "-" turns it off.
    digest-cron: ${USER_SCREEN_TIME_DIGEST_CRON:0 5 * * * *}

  data-export:
    poll-millis: ${DATA_EXPORT_POLL_MILLIS:5000}
    cleanup-millis: ${DATA_EXPORT_CLEANUP_MILLIS:900000}
    # A build reads three services and uploads one file; ten minutes is far past a healthy one.
    lease: 10m
    max-attempts: 3
    # As live: "When your file is ready for download, it'll be available for 4 days."
    available-for: 4d
    link-ttl: 5m
    cleanup-batch-size: 100

# What a data export reads, through each service's internal prefix (see DataExportSources).
downstream:
  video-service-uri: ${VIDEO_SERVICE_URI:http://localhost:8083}
  interaction-service-uri: ${INTERACTION_SERVICE_URI:http://localhost:8085}
  chat-service-uri: ${CHAT_SERVICE_URI:http://localhost:8088}
  # Generous: these are background reads of up to a hundred rows, nobody is waiting on a page.
  timeout-millis: 10000

app:
  media:
    # Hosts allowed for UpdateProfileRequest.avatarUrl (http or https - see @ValidMediaUrl).
    # Override MEDIA_ALLOWED_HOSTS (comma-separated) with the real CDN/MinIO public host(s) in prod.
    # No allowed-buckets here: this service accepts no s3:// URLs.
    #
    # localhost is in the default because minio.endpoint below defaults to it: the avatar upload
    # hands the client a URL on that host, and a client PATCHing its own profile back must not be
    # rejected on a URL we produced. Keep the two in step - a deployment that moves MINIO_ENDPOINT,
    # or fronts it with a CDN, has to name that host here as well.
    allowed-hosts: ${MEDIA_ALLOWED_HOSTS:cdn.tiktok-clone.local,localhost}
  avatar:
    # The size POST /users/me/avatar accepts. Mirrored by the client's own check, and by the
    # multipart limits above, which have to stay larger than it.
    max-bytes: ${AVATAR_MAX_BYTES:5242880}

# Where uploaded avatars are written. Same bucket media-worker mirrors social pictures into, on
# purpose: both paths write avatars/{userId}, so a profile has one avatar object, not two.
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:video-media}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
