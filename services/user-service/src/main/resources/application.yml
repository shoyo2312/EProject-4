server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # listFollowers/listFollowing/listBlocked/listMuted take a Pageable straight from the
        # query string, so without a cap a client can ask for ?size=100000 and pull the whole
        # relation table in one request. Same values as video-service.
        default-page-size: 20
        max-page-size: 50

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

app:
  avatar:
    # Hosts allowed for UpdateProfileRequest.avatarUrl (must also be https - see ValidAvatarUrl).
    # Override AVATAR_ALLOWED_HOSTS (comma-separated) with the real CDN/MinIO public host(s) in prod.
    allowed-hosts: ${AVATAR_ALLOWED_HOSTS:cdn.tiktok-clone.local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
