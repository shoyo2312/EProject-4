server:
  port: 8084

spring:
  application:
    name: media-worker

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: media-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Normalizing re-encodes every frame and runs on the listener thread, so one message can
      # hold the partition for minutes. Left at Spring's 5-minute default the broker would call
      # this consumer dead mid-encode, rebalance, redeliver the same video and start the encode
      # again — slower every round. The hour here covers the worst case the timeouts allow: three
      # transcode attempts at the 600s ffmpeg cap plus their downloads and backoff.
      # ponytail: this is the cheap version of moving transcoding off the listener thread. If a
      # second worker ever has to keep flowing past a slow video, that is the change to make.
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 3600000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:video-media}

media:
  video:
    # Backstop for the storage-edge limit video-service signs into its POST policy.
    # Same env vars as video-service's app.upload — keep them in step.
    max-bytes: ${VIDEO_MAX_BYTES:524288000}          # 500 MB
    max-duration-seconds: ${VIDEO_MAX_DURATION_SECONDS:600}  # 10 minutes
  moderation:
    # Automatic NSFW screening — services/moderation-service. Internal network only, no auth,
    # not routed at the gateway, same as rank-service.
    #
    # The thresholds are NOT here: they belong to the model and live in that service's own
    # environment, so tuning them is a restart of one container rather than a rebuild of this one.
    enabled: ${MODERATION_ENABLED:true}
    base-url: ${MODERATION_SERVICE_URL:http://localhost:8099}
    # Ten frames spread over the whole video. Enough that a clip which is only explicit near the
    # end still lands two samples inside it -- which is what the reject rule needs -- and few
    # enough that a CPU-only classifier answers in about a second.
    frame-count: ${MODERATION_FRAME_COUNT:10}
    # Nobody is waiting on this: it runs after the upload is already stored and transcoded. The
    # timeout only has to be shorter than the point at which a hung classifier is worth giving up
    # on, not short enough to protect a request.
    timeout-millis: ${MODERATION_TIMEOUT_MILLIS:30000}
    attempts: ${MODERATION_ATTEMPTS:3}
    retry-backoff-millis: ${MODERATION_RETRY_BACKOFF_MILLIS:3000}
  avatar:
    # The only hosts this worker will fetch an avatar from. Google serves pictures from lh3,
    # Facebook from platform-lookaside and the fbcdn host its redirects land on. Anything else an
    # event names is refused rather than fetched — see AvatarMirrorService.
    allowed-hosts: ${AVATAR_ALLOWED_HOSTS:lh3.googleusercontent.com,platform-lookaside.fbsbx.com,graph.facebook.com,scontent.xx.fbcdn.net}
    max-bytes: ${AVATAR_MAX_BYTES:5242880}
