server:
  port: 8086

spring:
  application:
    name: story-service

  mongodb:
    uri: mongodb://${MONGO_USERNAME:root}:${MONGO_PASSWORD:password}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/story_db?authSource=admin

  data:
    mongodb:
      # Off by default since Spring Data Mongo 3.x: without it @Indexed — the TTL, the unique
      # media key and the unique (storyId, viewerId) view — is silently never created.
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

story:
  ttl-hours: 24
  upload:
    # Signed into the presigned POST, so MinIO refuses a bigger file itself.
    image-max-bytes: ${STORY_IMAGE_MAX_BYTES:10485760}
    video-max-bytes: ${STORY_VIDEO_MAX_BYTES:52428800}

moderation:
  text:
    # Screens story captions at create (moderation-lib). false measures without refusing or
    # holding anything. See docs/moderation.md.
    enforce: ${TEXT_MODERATION_ENFORCE:true}
    classifier:
      base-url: ${MODERATION_SERVICE_URL:http://localhost:8099}
      enforce: ${TEXT_CLASSIFIER_ENFORCE:true}
    admin-terms:
      base-url: ${ADMIN_SERVICE_URL:http://localhost:8096}

minio:
  # The same bucket video-service and media-worker use. endpoint is what presigned reads are
  # signed for — SigV4 signs the host — so outside the service network it is the public address.
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  upload-url: ${MEDIA_UPLOAD_URL:${minio.endpoint}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:video-media}
  region: ${MINIO_REGION:us-east-1}
  url-expiry: ${MINIO_URL_EXPIRY:15m}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
