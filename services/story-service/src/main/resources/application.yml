server:
  port: 8086

spring:
  application:
    name: story-service

  data:
    mongodb:
      uri: mongodb://root:password@localhost:27017/story_db?authSource=admin

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

story:
  ttl-hours: 24

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
