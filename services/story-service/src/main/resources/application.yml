server:
  port: 8086

spring:
  application:
    name: story-service

  mongodb:
    uri: mongodb://${MONGO_USERNAME:root}:${MONGO_PASSWORD:password}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/story_db?authSource=admin

  data:
    mongodb:
      # Off by default since Spring Data Mongo 3.x: without it @Indexed — the TTL, the unique
      # media key and the unique (storyId, viewerId) view — is silently never created.
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

story:
  ttl-hours: 24

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
