server:
  port: 8097

spring:
  application:
    name: analytics-service

  datasource:
    # http_connection_provider is stated rather than left to the driver: clickhouse-jdbc
    # prefers the Apache client, which is an optional dependency we do not ship, so every
    # insert logged a NoClassDefFoundError stack trace before falling back to this same
    # provider. Naming it skips the failed attempt; the connection behaviour is unchanged.
    url: jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/analytics_db?http_connection_provider=HTTP_URL_CONNECTION
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:clickhouse}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Stated rather than left to the defaults: this service produces nothing of its own, but
    # kafka-lib's recoverer needs a template to write the dead-letter copy of a record it gave up
    # on, and that record's key and value are the strings the consumer below deserialized.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      # Let a poll fill up before it returns. Each poll the busy listeners get is one INSERT and so
      # one ClickHouse part (KafkaBatchConfig), and by default a poll returns the moment one record
      # is there — at moderate traffic still a part for every record or two. Up to a second late
      # is nothing to a dashboard or a training run.
      fetch-min-size: 64KB
      fetch-max-wait: 1s
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
