server:
  port: 8097

spring:
  application:
    name: analytics-service

  datasource:
    # http_connection_provider is stated rather than left to the driver: clickhouse-jdbc
    # prefers the Apache client, which is an optional dependency we do not ship, so every
    # insert logged a NoClassDefFoundError stack trace before falling back to this same
    # provider. Naming it skips the failed attempt; the connection behaviour is unchanged.
    url: jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/analytics_db?http_connection_provider=HTTP_URL_CONNECTION
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:clickhouse}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-0123456789}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
