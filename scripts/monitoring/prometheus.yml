# Baked into the prometheus image by docker-compose.prod.yml: Coolify mounts nothing from the repo.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ "alertmanager:9093" ]

scrape_configs:
  # Every Java service serves this without a token (common-lib ManagementDefaults, security-lib
  # ActuatorSecurityAutoConfiguration). Each meter already carries an `application` tag, which is
  # what the alerts group by. api-gateway keeps actuator off its public port, on 8180.
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8180
          - auth-service:8081
          - user-service:8082
          - video-service:8083
          - media-worker:8084
          - interaction-service:8085
          - story-service:8086
          - recommendation-service:8087
          - chat-service:8088
          - notification-service:8089
          - search-service:8095
          - admin-service:8096
          - analytics-service:8097
